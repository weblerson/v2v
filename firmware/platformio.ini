[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_port  = /dev/ttyACM0
monitor_port = /dev/ttyACM0
lib_deps =
    electroniccats/MPU6050@^1.4.1
    mikalhart/TinyGPSPlus@^1.1.0

; DW1000Ng is vendored under lib/ rather than pulled from the registry — the
; upstream repository is archived. See lib/DW1000Ng/VENDORING.md.

; Production firmware.
[env:esp32doit-devkit-v1]
build_src_filter = +<*> -<tools/>

; Bring-up stage E1: raw SPI read of the DW1000 DEV_ID register. Run this on
; each board, one at a time, before anything else touches the module.
[env:uwb_probe]
build_src_filter = +<*> -<main.cpp> -<tools/> +<tools/uwb_probe.cpp>

; Bring-up stage E4: antenna delay calibration. Flash to both boards.
[env:uwb_calib]
build_src_filter = +<*> -<main.cpp> -<tools/> +<tools/uwb_calib.cpp>
